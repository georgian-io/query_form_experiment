<svg viewBox="0 0 452 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,sans-serif" style="width:100%;height:auto;display:block"><style>.ju{fill:#e5e3de}.jg{fill:#17518f}.jr{fill:#5598e7}.jd{stroke:#c9c7c0;stroke-width:1;stroke-dasharray:3 3}.jh{font-size:12.5px;fill:#5d5b57;font-weight:650}.jl{font-size:12px;fill:#6d6b66}.jn{font-size:11px;fill:#898781}.jv{font-size:12.5px;fill:#6d6b66;font-weight:640}.jk{font-size:10px;fill:#98968f}@media(prefers-color-scheme:dark){.ju{fill:#3a3934}.jd{stroke:#4d4b46}.jh{fill:#c3c2b7}.jl{fill:#a8a69e}.jv{fill:#a8a69e}}</style><text class="jk" x="58" y="12">the top 10 results, rank 1 to 10</text><text class="jk" x="318" y="12">not retrieved</text><text class="jk" x="394" y="12">NDCG@10</text><text class="jh" x="0" y="36">Scenario 1 - one document judged relevant</text><text class="jl" x="0" y="62">Model A</text><rect class="jg" x="58" y="46" width="21" height="22" rx="2.5"/><rect class="ju" x="82" y="46" width="21" height="22" rx="2.5"/><rect class="ju" x="106" y="46" width="21" height="22" rx="2.5"/><rect class="ju" x="130" y="46" width="21" height="22" rx="2.5"/><rect class="ju" x="154" y="46" width="21" height="22" rx="2.5"/><rect class="ju" x="178" y="46" width="21" height="22" rx="2.5"/><rect class="ju" x="202" y="46" width="21" height="22" rx="2.5"/><rect class="ju" x="226" y="46" width="21" height="22" rx="2.5"/><rect class="ju" x="250" y="46" width="21" height="22" rx="2.5"/><rect class="ju" x="274" y="46" width="21" height="22" rx="2.5"/><rect class="ju" x="318" y="46" opacity="0.35" width="21" height="22" rx="2.5"/><rect class="ju" x="342" y="46" opacity="0.35" width="21" height="22" rx="2.5"/><text class="jv" x="394" y="62">1.000</text><text class="jl" x="0" y="92">Model B</text><rect class="jg" x="58" y="76" width="21" height="22" rx="2.5"/><rect class="ju" x="82" y="76" width="21" height="22" rx="2.5"/><rect class="ju" x="106" y="76" width="21" height="22" rx="2.5"/><rect class="ju" x="130" y="76" width="21" height="22" rx="2.5"/><rect class="ju" x="154" y="76" width="21" height="22" rx="2.5"/><rect class="ju" x="178" y="76" width="21" height="22" rx="2.5"/><rect class="ju" x="202" y="76" width="21" height="22" rx="2.5"/><rect class="ju" x="226" y="76" width="21" height="22" rx="2.5"/><rect class="ju" x="250" y="76" width="21" height="22" rx="2.5"/><rect class="ju" x="274" y="76" width="21" height="22" rx="2.5"/><rect class="ju" x="318" y="76" opacity="0.35" width="21" height="22" rx="2.5"/><rect class="ju" x="342" y="76" opacity="0.35" width="21" height="22" rx="2.5"/><text class="jv" x="394" y="92">1.000</text><line class="jd" x1="308" y1="42" x2="308" y2="102"/><text class="jn" x="0" y="114">Both models put the judged document first. Ranks 2-10 are</text><text class="jn" x="0" y="128">unlabelled, so the metric cannot tell these two rankings apart.</text><text class="jh" x="0" y="166">Scenario 2 - the same rankings, three documents judged relevant</text><text class="jl" x="0" y="192">Model A</text><rect class="jg" x="58" y="176" width="21" height="22" rx="2.5"/><rect class="jr" x="82" y="176" width="21" height="22" rx="2.5"/><rect class="ju" x="106" y="176" width="21" height="22" rx="2.5"/><rect class="jr" x="130" y="176" width="21" height="22" rx="2.5"/><rect class="ju" x="154" y="176" width="21" height="22" rx="2.5"/><rect class="ju" x="178" y="176" width="21" height="22" rx="2.5"/><rect class="ju" x="202" y="176" width="21" height="22" rx="2.5"/><rect class="ju" x="226" y="176" width="21" height="22" rx="2.5"/><rect class="ju" x="250" y="176" width="21" height="22" rx="2.5"/><rect class="ju" x="274" y="176" width="21" height="22" rx="2.5"/><rect class="ju" x="318" y="176" opacity="0.35" width="21" height="22" rx="2.5"/><rect class="ju" x="342" y="176" opacity="0.35" width="21" height="22" rx="2.5"/><text class="jv" x="394" y="192">0.967</text><text class="jl" x="0" y="222">Model B</text><rect class="jg" x="58" y="206" width="21" height="22" rx="2.5"/><rect class="ju" x="82" y="206" width="21" height="22" rx="2.5"/><rect class="ju" x="106" y="206" width="21" height="22" rx="2.5"/><rect class="ju" x="130" y="206" width="21" height="22" rx="2.5"/><rect class="ju" x="154" y="206" width="21" height="22" rx="2.5"/><rect class="ju" x="178" y="206" width="21" height="22" rx="2.5"/><rect class="ju" x="202" y="206" width="21" height="22" rx="2.5"/><rect class="ju" x="226" y="206" width="21" height="22" rx="2.5"/><rect class="ju" x="250" y="206" width="21" height="22" rx="2.5"/><rect class="ju" x="274" y="206" width="21" height="22" rx="2.5"/><rect class="jr" x="318" y="206" width="21" height="22" rx="2.5"/><rect class="jr" x="342" y="206" width="21" height="22" rx="2.5"/><text class="jv" x="394" y="222">0.469</text><line class="jd" x1="308" y1="172" x2="308" y2="232"/><text class="jn" x="0" y="244">A had the other two relevant documents at ranks 2 and 4 all along. B</text><text class="jn" x="0" y="258">never retrieved them - they fall outside its top 10 entirely. Both</text><text class="jn" x="0" y="272">models return the same ten results in either scenario; all that</text><text class="jn" x="0" y="286">changed between the two is how many documents were judged.</text><rect class="jg" x="0" y="303" width="11" height="11" rx="2"/><text class="jk" x="15" y="312">the judged gold</text><rect class="jr" x="116.5" y="303" width="11" height="11" rx="2"/><text class="jk" x="131.5" y="312">also relevant</text><rect class="ju" x="222.39999999999998" y="303" width="11" height="11" rx="2"/><text class="jk" x="237.39999999999998" y="312">unjudged</text></svg>